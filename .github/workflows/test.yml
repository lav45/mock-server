name: test

on:
  push:
    branches:
      - '**'
    paths:
      - .github/workflows/test.yml
      - bin/**
      - migrates/**
      - src/**
      - test/**
      - composer.lock
      - deptrac.yaml
      - phpunit.xml.dist
      - Dockerfile
  pull_request:
    paths:
      - .github/workflows/test.yml
      - bin/**
      - migrates/**
      - src/**
      - test/**
      - composer.lock
      - deptrac.yaml
      - phpunit.xml.dist
      - Dockerfile
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build images
        run: ./build.sh

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ./vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('./composer.lock') }}

      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: ./tools
          key: ${{ runner.os }}-tools-${{ hashFiles('./tools/*/composer.lock') }}

      - name: Install composer with dev dependencies
        run: ./composer install --optimize-autoloader --classmap-authoritative --prefer-dist --no-progress --ansi

      - run: ./composer check
      - run: ./composer deptrac
      - run: ./composer unused

      - name: Running functional tests
        run: test/Functional/start.sh

      - name: Running phpunit tests with code coverage
        run: test/Unit/start.sh coverage:xml

      - name: Running benchmark tests
        run: test/benchmark/start.sh

      - name: Upload coverage reports to Codecov
        if: github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml